name: Bootstrap Tiny5 font

on:
  push:
    branches:
      - feature/spreadsheet-redesign-v1

permissions:
  contents: write

jobs:
  vendor-font:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spreadsheet-redesign-v1
          fetch-depth: 0

      - name: Vendor verified Tiny5 asset and license
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="Game/Assets/_Project/Resources/Fonts"
          mkdir -p "$FONT_DIR"

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Gissio/font_Tiny5/main/fonts/ttf/Tiny5-Regular.ttf" \
            --output "$FONT_DIR/Tiny5-Regular.ttf"

          # Verify the exact upstream Git blob we inspected before vendoring it.
          size=$(wc -c < "$FONT_DIR/Tiny5-Regular.ttf" | tr -d ' ')
          actual_blob=$( { printf 'blob %s\0' "$size"; cat "$FONT_DIR/Tiny5-Regular.ttf"; } | sha1sum | cut -d' ' -f1 )
          test "$actual_blob" = "4537957cc9c759b7ea87a6a9d05c4a0c5a5bae23"

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Gissio/font_Tiny5/main/OFL.txt" \
            --output "$FONT_DIR/Tiny5-OFL.txt"

          cat > "$FONT_DIR/Tiny5-Regular.ttf.meta" <<'EOF'
          fileFormatVersion: 2
          guid: 6ec84fb8e44f468c8f4ed29c941d2341
          TrueTypeFontImporter:
            externalObjects: {}
            serializedVersion: 4
            fontSize: 16
            forceTextureCase: -2
            characterSpacing: 0
            characterPadding: 1
            includeFontData: 1
            fontNames: []
            fallbackFontReferences: []
            customCharacters: 
            fontRenderingMode: 0
            ascentCalculationMode: 1
            useLegacyBoundsCalculation: 0
            shouldRoundAdvanceValue: 1
            userData: 
            assetBundleName: 
            assetBundleVariant: 
          EOF

          cat > "$FONT_DIR/Tiny5-OFL.txt.meta" <<'EOF'
          fileFormatVersion: 2
          guid: 08665ab3b8484297b54cc5e662cc2e2e
          TextScriptImporter:
            externalObjects: {}
            userData: 
            assetBundleName: 
            assetBundleVariant: 
          EOF

          # This workflow is a one-shot transport for a binary asset. Do not leave build-time network
          # dependencies in the jam project after the font has been vendored.
          rm -f .github/workflows/bootstrap-tiny5.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FONT_DIR/Tiny5-Regular.ttf" "$FONT_DIR/Tiny5-Regular.ttf.meta" \
                  "$FONT_DIR/Tiny5-OFL.txt" "$FONT_DIR/Tiny5-OFL.txt.meta" \
                  .github/workflows/bootstrap-tiny5.yml
          git commit -m "assets: vendor Tiny5 pixel font"
          git push origin HEAD:feature/spreadsheet-redesign-v1
